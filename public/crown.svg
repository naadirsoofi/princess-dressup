<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Crown base -->
  <rect x="10" y="70" width="80" height="20" fill="url(#crownGradient)" rx="5"/>
  
  <!-- Crown points -->
  <polygon points="20,70 30,40 40,70" fill="url(#crownGradient)"/>
  <polygon points="30,70 40,30 50,70" fill="url(#crownGradient)"/>
  <polygon points="40,70 50,20 60,70" fill="url(#crownGradient)"/>
  <polygon points="50,70 60,30 70,70" fill="url(#crownGradient)"/>
  <polygon points="60,70 70,40 80,70" fill="url(#crownGradient)"/>
  
  <!-- Gems -->
  <circle cx="35" cy="55" r="3" fill="#FF69B4"/>
  <circle cx="50" cy="45" r="4" fill="#9370DB"/>
  <circle cx="65" cy="55" r="3" fill="#00CED1"/>
  
  <!-- Center jewel -->
  <circle cx="50" cy="35" r="5" fill="#FF1493"/>
  
  <!-- Sparkles -->
  <text x="15" y="25" font-family="Arial" font-size="8" fill="#FFD700">✨</text>
  <text x="85" y="35" font-family="Arial" font-size="6" fill="#FFD700">✨</text>
  <text x="25" y="85" font-family="Arial" font-size="7" fill="#FFD700">✨</text>
</svg>
